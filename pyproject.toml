[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traktor-nml-tool"
version = "0.1.0"
description = "A CLI for inspecting, repairing, merging, and splitting Traktor DJ software's .nml collection files."
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "lxml",
]

[project.optional-dependencies]
tags = [
    "mutagen",
]
fingerprint = [
    "pyacoustid",
]
gui = [
    "nicegui>=3.16.0",
    "pywebview",
]
docs = [
    "sphinx>=8.0,<9.0",
]
all = [
    "traktor-nml-tool[tags,fingerprint,gui]",
]

[tool.setuptools]
packages = ["traktor_nml", "traktor_nml.commands", "traktor_nml.gui"]

# The seven vendored IBM Plex faces and their licence. A wheel
# without them answers 404 for every face and the page falls back
# to the system stack without saying so (DL-168).
[tool.setuptools.package-data]
"traktor_nml.gui" = ["fonts/*.woff2", "fonts/OFL.txt"]
